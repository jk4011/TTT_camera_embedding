# Depth-4 fast weights + 4 rotary sites ("one rotary per address space"):
# input (qk, F=21 -> 252/256), h1 (F=42 -> 504/512), s2 (F=42 -> 504/512),
# s3 (F=42 -> 504/512).
# Same depth-4 inner net as cam_fw4l_base; params identical up to rotary
# gains (+882/layer = +5,292 total vs cam_fw4l_base).
# Measured totals (L6/d256/p16): fw4l_rot4 12,799,946 / fw4l 12,794,654
#   (fw3l_rot3 11,224,028 / fw3l 11,220,248 for reference; the 3L->4L step
#    costs +262,401/layer = +1,574,406 total, all of it the new wc matrix
#    plus its lr channel).
patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: fw4l_rot4
      num_freqs: 21
      num_freqs_h: 42
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
