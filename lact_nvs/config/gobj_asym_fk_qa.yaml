patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: asym_in
      num_freqs_seg: 14
      asym_k: 3
      asym_key: foot
      asym_query: anchor
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
