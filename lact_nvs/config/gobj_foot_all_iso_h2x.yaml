patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: foot_in+h_foot+vo_rel+iso
      num_freqs_seg: 21
      num_freqs_hseg: 42
      n_dirs: 6
      omega_scale_h: 2.0
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
