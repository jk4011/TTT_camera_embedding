patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: qk_rope_cam
      num_freqs: 21
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4

# Multi-chunk training (NODE2_PROMPT_MULTICHUNK.md): one n drawn per forward,
# so a single model learns to update under every chunk count. Safe only at
# nproc_per_node=1 (launch_exp.sh), see model.py note.
ttt_num_chunks: [1, 2, 4, 8]
