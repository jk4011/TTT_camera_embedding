# Depth-4 fast weights, no rotary (4L baseline; third point of the
# depth x rotary interaction after 2L and 3L).
# Inner net per head: f(x) = W_d silu(W_c silu(W_b (silu(W1 x) * (W3 x))))
#   d=256, d_h=512 (inter_multi=2), d_h2=d_h3=512; fast weights W1,W3,W_b,W_c,W_d.
#   Every internal width stays at d_h, the same rule fw3l uses (d_h2=d_h), so
#   the 2L/3L/4L ladder varies DEPTH only.
# Params vs cam_fw3l_base: +wc (512x512) + 5th lr channel (+257)
#   = +262,401 per TTT layer -> +1,574,406 total (L6/d256/p16).
# Measured totals (L6/d256/p16):
#   fw4l 12,794,654 / fw4l_rot4 12,799,946
#   (fw3l 11,220,248 / fw3l_rot3 11,224,028 for reference).
# fw4l / fw4l_rot4 differ only in rotary gain params (+5,292)
# -> the base-vs-rot4 comparison is param-neutral.
patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: fw4l
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
