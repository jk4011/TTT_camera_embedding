patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: h_foot+dpt_lin+dpt_abs+pdir+vo_rope   # ABSOLUTE depth from a separate linear head on x (RayRoPE-style, no sigma)
      num_freqs_seg: 32        # point half: 3/4 of the pair budget (2026-09-25)
      num_freqs_dir_seg: 10    # ray-direction half: 1/4  (3 x (32+10) = 126 pairs, as before)
      num_freqs_hseg: 63       # hidden point half: 3/4
      num_freqs_dir_hseg: 21   # hidden ray half: 1/4  (3 x (63+21) = 252 pairs, as before)
      vo_coords: foot
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
