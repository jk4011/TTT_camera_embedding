patch_size: 16
dim: 256
layers: 6

block_config:
  - type: model.SelfAttention
    length_dim: l
    params:
      head_dim: 64
      use_qk_norm: true
  - type: lact_ttt_cam.CamFastWeightGluMLPMultihead
    length_dim: vl
    params:
      head_dim: 256
      inter_multi: 2
      base_lr: 0.01
      muon_update_steps: 5
      cam_mode: h_foot+dpt_lin+dpt_abs+vo_rope   # POINT ONLY, hidden + v/o (no input site; user, 2026-09-25)
      num_freqs_seg: 42        # the whole input budget on the point: 3 x 42 = 126 pairs, as the split cells
      num_freqs_hseg: 84       # the whole hidden budget on the point: 3 x 84 = 252 pairs
      vo_coords: foot
  - type: model.MLP
    length_dim: vl
    params:
      inter_multi: 4
